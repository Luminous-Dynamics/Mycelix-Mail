apiVersion: v1
kind: Secret
metadata:
  name: mycelix-secrets
  namespace: mycelix-mail
type: Opaque
stringData:
  # These are placeholders - use sealed-secrets or external-secrets in production
  database-url: "postgres://mycelix:CHANGE_ME@postgres:5432/mycelix_mail"
  redis-url: "redis://redis:6379"
  jwt-secret: "CHANGE_ME_TO_A_SECURE_32_BYTE_SECRET"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelix-config
  namespace: mycelix-mail
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080

    [database]
    max_connections = 20
    min_connections = 5
    connect_timeout_secs = 10

    [redis]
    default_ttl_secs = 300

    [rate_limit]
    requests_per_minute = 100
    burst_size = 20

    [cors]
    allowed_origins = ["https://mycelix.mail"]

    [trust]
    default_score = 0.5
    cache_ttl_secs = 60

    [holochain]
    connection_timeout_secs = 30

    [ml]
    enabled = true
    model = "llama3.2"
